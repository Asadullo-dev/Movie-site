<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin panel</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h1 class="logo">Admin panel</h1>
    <a href="index.html" class="admin-btn">Saytga qaytish</a>
  </div>

  <!-- Parol kiritish qismi -->
  <div class="login-box" id="loginBox" data-aos="zoom-in">
    <h2>Admin kirish</h2>
    <input type="password" id="password" placeholder="Parolni kiriting">
    <p id="error"></p>
    <button onclick="login()">Kirish</button>
  </div>

  <!-- Admin panel (parol to'g'ri bo'lsa chiqadi) -->
  <div class="admin-page" id="adminBox" style="display: none;">

    <h2 id="formTitle">Yangi kino qo'shish</h2>
    <div class="form">
      <input type="text" id="title" placeholder="Kino nomi">
      <input type="number" id="year" placeholder="Yili">
      <input type="text" id="genre" placeholder="Janri">
      <input type="number" id="rating" placeholder="Reyting (masalan 8.5)" step="0.1">
      <input type="text" id="img" placeholder="Rasm linki">
      <input type="text" id="video" placeholder="Video linki (.mp4)">
      <button id="saveBtn" onclick="saveMovie()">Qo'shish</button>
      <button id="cancelBtn" onclick="clearForm()" style="display: none;">Bekor qilish</button>
    </div>

    <h2>Kinolar ro'yxati</h2>
    <div id="list"></div>

    <br>
    <button class="reset-btn" onclick="resetMovies()">Qayta yuklash</button>

  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="admin.js"></script>
</body>
</html>
